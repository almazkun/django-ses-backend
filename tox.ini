[tox]
envlist =
    py{311,312}-django42
    py{311,312,313}-django{50,51,52}

[testenv]
deps =
    django42: django==4.2.*
    django42: aiohttp>=3.11,<4.0
    django50: django==5.0.*
    django50: aiohttp>=3.11,<4.0
    django51: django==5.1.*
    django51: aiohttp>=3.11,<4.0
    django52: django==5.2.*
    django52: aiohttp>=3.11,<4.0
commands =
    python runtests.py
